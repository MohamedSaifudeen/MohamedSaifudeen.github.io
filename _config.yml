title: Mohamed Saifudeen
tagline: "Aspiring SOC Analyst — Blue Team & Detection"
description: >-
  Security portfolio of Mohamed Saifudeen: TryHackMe writeups, a home SOC lab
  build, and ongoing work toward SOC analyst / blue team roles.

# TODO: replace with your real GitHub Pages URL, e.g. https://yourusername.github.io
url: "https://yourusername.github.io"
baseurl: ""

author:
  name: Mohamed Saifudeen
  role: "SOC Analyst (entry-level) / Blue Team"
  # TODO: fill these in — leave "" for any you don't want to publish
  email: "mohamedsaifudeen32004@gmail.com"
  github: "https://github.com/MohamedSaifudeen"
  medium: ""
  tryhackme: "https://tryhackme.com/p/RogueHawk"
  hackthebox: "https://ctf.hackthebox.com/user/profile/442352"
  linkedin: "https://linkedin.com/in/mohamedsaifudeen"

# --- Collections -----------------------------------------------------------
# Adding new content is just: drop a new .md file in _writeups/ or _projects/
# with the right front matter. No template edits needed.
collections:
  writeups:
    output: true
    permalink: /writeups/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "writeups"
    values:
      layout: writeup
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: page

# --- Build -------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed
  sass_dir: assets/css

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
